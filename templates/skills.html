
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills | Internship Matcher</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">
            <span class="logo-icon">✦</span>
            Internship Matcher
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/profile">My Profile</a>
            <a href="/skills" class="active">My Skills</a>
            <a href="/internships">Internships</a>
        </div>
    </nav>

    <main class="how-section">
        <div class="section-heading">
            <span class="eyebrow">SHOWCASE YOUR STRENGTHS</span>
            <h2>Build your skill profile</h2>
            <p>Add a skill you know to help find suitable internships.</p>
        </div>

        <form method="POST" action="/skills"
              style="max-width: 550px; margin: auto; background: white; padding: 30px; border-radius: 22px;">

            <label for="name">Technical skill</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="e.g. Python"
                required
                style="width: 100%; padding: 14px; margin: 12px 0 20px; border: 1px solid lavender; border-radius: 12px;"
            >

            <button type="submit" class="btn btn-primary"
                    style="border: none; cursor: pointer; width: 100%;">
                Save Skill →
            </button>
        </form>

        <p style="text-align: center; margin-top: 25px;">
            <a href="/" class="step-link">← Back to Home</a>
        </p>
    </main>
</body>
</html>
